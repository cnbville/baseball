name: Build Diamond Finder for Mac

on:
  push:
    paths: ["diamond-finder/**", ".github/workflows/build-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.10.0
      - name: Build app
        working-directory: diamond-finder
        run: |
          pyinstaller --noconfirm --windowed --name "Diamond Finder" \
            --add-data "presets.json:." app.py
      - name: Make dmg
        run: |
          mkdir -p dmgroot
          cp -R "diamond-finder/dist/Diamond Finder.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Diamond Finder" -srcfolder dmgroot -ov -format UDZO DiamondFinder.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DiamondFinder-dmg
          path: DiamondFinder.dmg
      - name: Publish to the diamond-finder release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view diamond-finder >/dev/null 2>&1 || \
            gh release create diamond-finder --target "$GITHUB_SHA" --title "Diamond Finder (Mac)" \
              --notes "Latest Mac build of Diamond Finder. Download DiamondFinder.dmg below."
          gh release upload diamond-finder DiamondFinder.dmg --clobber
