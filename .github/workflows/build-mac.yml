name: Build Diamond Finder for Mac

on:
  push:
    paths: ["diamond-finder/**", ".github/workflows/build-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so an older run can never publish over a newer one.
concurrency:
  group: build-mac
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller==6.10.0 pywebview==5.4
      - name: Make the app icon
        working-directory: diamond-finder
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
      - name: Font licence
        run: curl -fsSL -o diamond-finder/ui/fonts/OFL.txt https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/OFL.txt
      - name: Build app
        working-directory: diamond-finder
        run: |
          pyinstaller --noconfirm --windowed --name "Diamond Finder" \
            --icon build/icon.icns --osx-bundle-identifier com.cnbville.diamondfinder \
            --add-data "presets.json:." --add-data "ui:ui" \
            --hidden-import bridge --hidden-import updater --hidden-import version app.py
      - name: Require macOS 13.3 or newer (its WebKit draws the Showtime look)
        run: |
          APP="diamond-finder/dist/Diamond Finder.app"
          plutil -replace LSMinimumSystemVersion -string 13.3 "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
      - name: Make dmg
        run: |
          mkdir -p dmgroot
          cp -R "diamond-finder/dist/Diamond Finder.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Diamond Finder" -srcfolder dmgroot -ov -format UDZO DiamondFinder.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DiamondFinder-dmg
          path: DiamondFinder.dmg
      - name: Publish a release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import sys; sys.path.insert(0, 'diamond-finder'); from version import __version__; print(__version__)")
          TAG="diamond-finder-v$VER"
          NOTES=$(git log -1 --format=%s)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump __version__ in diamond-finder/version.py so installed apps see the update."
            exit 1
          fi
          gh release create "$TAG" DiamondFinder.dmg --target "$GITHUB_SHA" --latest \
            --title "Diamond Finder $VER" --notes "$NOTES"
